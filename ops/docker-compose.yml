# VBMF V0.2 - BASE Deployment Compose (no host port publishing)
# Source of Truth: docs/architecture/DEPLOYMENT_AND_DEV_RUNTIME.md
#
# Layering (FLOW-01 / DEPLOY-02):
#   docker-compose.yml        = BASE (services, internal net, expose only, secrets via ${})
#   compose.dev.yml           = DEV overlay (HMR, bind mount, publish 5173/3000)
#   compose.acceptance.yml    = ACCEPTANCE overlay (pinned, Nginx 443 + SRS media ports)
#   compose.prod.yml          = PROD overlay (Nginx 443 only, no HMR, immutable)
#
# Production Core Dependency Rule (PRODUCTION-READINESS-ENTRY-01 / PR-01A, 2026-09-29):
#   "no current consumer != production core dependency".
#   CORE (no profile, started by default): db + media-agent + fastify + web + nginx.
#     Fastify's only external dependency is PostgreSQL (verified: zero
#     redis/valkey/rustfs/srs consumers in apps/api/src).
#   OPTIONAL capability profiles — core must run normally when they are absent;
#   when explicitly enabled the capability fails honestly on its own:
#     --profile storage -> rustfs   (no live consumer yet)
#     --profile gateway -> srs      (no live consumer yet)
#     --profile worker  -> cache + worker (BullMQ placeholder; implementing a
#                        worker just to make compose green is FORBIDDEN)
#
# Conventions (from Deployment SoT):
#   - PostgreSQL host = "db", Valkey host = "cache", RustFS host = "rustfs"
#   - Media Agent = DeckLink/GStreamer/Live FFmpeg sole owner (Ownership SoT F2/F4/F11)
#   - Readiness wait: Fastify/Worker MUST wait for dependency *health* (not just start)
#   - Health Tree exposes Recovery State (NONE/RESTARTING/RECOVERED/RETRYING/BACKOFF/ESCALATED/MANUAL_REQUIRED)
#   - Self-Healing: restart policy + budget + backoff + circuit break (L1-L4)
#   - Nginx = SOLE external HTTP/HTTPS ingress (§8). Internal services use `expose`, NOT host publish.
#   - Secrets: NEVER hardcode. Provided via .env (gitignored) / Docker secrets / SSH provisioning (INFRA-SEC-01).
#
# NOTE: gVisor (runsc) + /dev/blackmagic has known real-runsc limits; verify on BMD server.
#       Alternative: runtime: runc + seccomp/AppArmor/capabilities (MEDIA-SEC-01 Option B).

services:
  # ---------- Core infra (internal only, no host publish) ----------
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vbmf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vbmf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vbmf} -d $${POSTGRES_DB:-vbmf}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------- Optional capability: storage (PR-01A profile) ----------
  # No live consumer in the control plane yet (apps/api/src has zero rustfs
  # references). Kept as the future object-storage entry point (EXTERNAL_API_CONTRACT
  # §8 presigned-URL flows); fails honestly at pull time while the pinned tag
  # drifts (BMD evidence) — pins are kept per DEPLOY-BASELINE-01, never latest.
  rustfs:
    image: rustfs/rustfs:2026.8.1   # pin release tag; NEVER latest (DEPLOY-BASELINE-01)
    profiles: ["storage"]
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RUSTFS_ACCESS:-vbmf}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET:-set RUSTFS_SECRET in .env when enabling storage}
    volumes:
      - rustfsdata:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------- Optional capability: gateway (PR-01A profile) ----------
  # Media protocol plane: RTMP/SRT/HLS/WHEP. No live consumer yet (Output Engine
  # egress is direct HLS/RTMP; SRS Gateway Adapter is future work). Published only
  # via profile overlays; pinned tag currently fails to pull (BMD evidence).
  srs:
    image: ossrs/srs:6.0.42   # pin specific patch (DEPLOY-BASE-01); SRS 6 line
    profiles: ["gateway"]
    expose:
      - "1935"   # RTMP
      - "1985"   # SRS HTTP API
      - "8080"   # HLS/HTTP-FLV
      - "8000"   # SRT
      - "1989"   # WHEP/WebRTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1985/api/v1/versions"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------- Optional capability: worker (PR-01A profile) ----------
  # cache (Valkey) + worker (BullMQ). EVENT_CONTRACT §1: Valkey is only an
  # External-event/webhook queue — never a Runtime event source. Zero live
  # consumers today; both stay behind the worker profile.
  cache:
    image: valkey/valkey:8-alpine
    profiles: ["worker"]
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      # §3.77 same class of fix: compose project dir = ops/, repo root = ..
      context: ..
      dockerfile: ops/Dockerfile.worker
    profiles: ["worker"]
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-vbmf}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DATABASE_NAME: ${POSTGRES_DB:-vbmf}
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS: ${RUSTFS_ACCESS:-vbmf}
      RUSTFS_SECRET: ${RUSTFS_SECRET:-set RUSTFS_SECRET in .env when enabling worker}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # DEPLOY-03: Worker MUST expose a deterministic health endpoint.
    # Contract: Worker runs a lightweight HTTP health server on :3000/health/worker.
    # PR-01A honest-fail contract: Dockerfile.worker is a deliberate placeholder
    # (no CMD) — the container exits immediately and this healthcheck FAILS.
    # That is the intended truthful signal until a real consumer exists; never
    # fake it green and never implement a stub worker just to satisfy compose.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/worker"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------- Core app (internal only, behind Nginx) ----------
  fastify:
    build:
      context: ..
      dockerfile: ops/Dockerfile.fastify
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-vbmf}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DATABASE_NAME: ${POSTGRES_DB:-vbmf}
      # CP-01A (RCE-D3 canonical): internal JSON-RPC Runtime Control at
      # media-agent:50051 /internal/v1/agent (compose private network only).
      # 8080 is the agent health/diagnostic listener, NOT the control plane.
      MEDIA_AGENT_RPC_URL: http://media-agent:50051
      TRUST_PROXY: "true"   # Nginx upstream
      # CP-01B: durable command plane (commands/audit_entries migrations on
      # boot; db is a compose dependency below).
      MIGRATE_ON_BOOT: "true"
      # CP-01C: Better Auth authn (fail-closed — the auth layer refuses to
      # boot unconfigured; /api/v1/* returns 503 instead of anonymous access).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # CP-01C: application-layer rate limiting (principal x action bucket,
      # in-memory sliding window; defaults 240 read / 60 write per minute).
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_READ_MAX: ${RATE_LIMIT_READ_MAX:-240}
      RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-60}
      # PR-01A: REDIS_*/RUSTFS_*/SRS_API wiring removed — apps/api has zero
      # consumers for them (Production Core Dependency Rule); the optional
      # services carry their own env under their profiles.
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      media-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      # §3.77 docker-compose.yml build context fix (. → ..); web 同样：
      # compose 项目目录 = ops/，仓库根 = ..。Dockerfile.web 自身以 .. 为根。
      context: ..
      dockerfile: ops/Dockerfile.web
    # DEPLOY-UI-01 + WEB-CONSOLE-ENTRY-01: browser never connects directly to
    # media-agent / :50051 / /internal/. Use same-origin /api /events /health
    # routed by nginx. Vite 已无 VITE_API_BASE / VITE_WS_BASE 等代理配置
    # ——前端代码使用相对路径。
    expose:
      - "5173"
    depends_on:
      fastify:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 literal: busybox wget may resolve localhost to ::1 while
      # the listener is IPv4 — deterministic probe (BMD acceptance RCA).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- Media Runtime (Sole DeckLink/GStreamer/Live FFmpeg owner) ----------
  media-agent:
    build:
      context: ..
      dockerfile: ops/Dockerfile.media-agent
    # DEPLOY-04: runtime NOT pinned in BASE. DEV defaults runc (no runsc needed);
    # ACCEPTANCE/PROD overlays set the MEDIA-SEC-01-validated runtime (runsc or runc+seccomp).
    # cap_add + runtime are applied per-profile overlay to avoid blocking dev without runsc.
    devices:
      - /dev/blackmagic:/dev/blackmagic   # DeckLink passthrough (F11); Host ffmpeg MUST NOT hold it
    environment:
      RUST_LOG: info
      DECKLINK_DEVICE_PATH: /dev/blackmagic
      # CP-01A (D3-R R-e): container-netns private bind for the internal
      # JSON-RPC Runtime Control surface — the compose private network is the
      # security boundary (no auth on this plane). NEVER host-publish 50051
      # and NEVER route /internal via Nginx. Default outside compose stays
      # loopback 127.0.0.1:50051.
      MEDIA_AGENT_RPC_BIND: 0.0.0.0:50051
    expose:
      - "8080"               # health/diagnostic listener (loopback in-container)
      - "50051"              # internal JSON-RPC Runtime Control (compose private net only)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped   # L2 Runtime Self-Heal; Budget/Backoff enforced externally

  # ---------- Ingress (SOLE external HTTP/HTTPS entry, §8) ----------
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      fastify:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Host ports published ONLY via profile overlays (dev/acceptance/prod), not base.
    expose:
      - "80"
      - "443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/nginx"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  rustfsdata:
