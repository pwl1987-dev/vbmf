# VBMF BMD-ACCEPTANCE overlay (CONTROL-PLANE-ENTRY-01 CP-01E / planning §8:
# "BMD：真实 systemd(agent) + compose Fastify"; WEB-CONSOLE-BMD-ACCEPTANCE-01:
# web placeholder override REMOVED — acceptance now serves the real Web Console).
#
# On the BMD host the media-agent runs NATIVELY (device lane: bmd-provider +
# gstreamer-backend, device binding manifest v5; the historical standalone
# lane). The compose stack brings the CONTROL PLANE only: db + fastify + web
# (real production Vite build via ops/Dockerfile.web, inherited from the BASE
# compose — this overlay no longer overrides it) + nginx. The Fastify
# container reaches the native host agent's internal JSON-RPC plane through
# the compose bridge gateway address — the agent's MEDIA_AGENT_RPC_BIND is
# bound to that bridge IP as an explicit acceptance ops action (D3-R: 私有
# bind 为显式运维动作; never 0.0.0.0/::, never host-published, never routed
# via Nginx).
#
# The CP-01E-era web placeholder (nginx + acceptance/web-placeholder.conf,
# commit 70ff46a) is preserved in Git history; live overlays must never
# resurrect it (scripts/check_control_plane_gate.py WCE-BMD gate).
#
# Usage (on BMD, inside the extracted exact-commit archive):
#   docker compose --env-file .env \
#     -f ops/docker-compose.yml -f ops/compose.bmd-acceptance.yml \
#     up -d --build db   (db first, healthy)
#   then: up -d --no-deps fastify web nginx   (web builds the real console)
#   MEDIA_AGENT_RPC_HOST=<bridge ip> must be set in .env.

services:
  fastify:
    environment:
      # Native host agent (device lane) internal control plane.
      MEDIA_AGENT_RPC_URL: http://${MEDIA_AGENT_RPC_HOST:?set MEDIA_AGENT_RPC_HOST in .env}:50051

  nginx:
    ports:
      - "8081:80"

  db:
    ports:
      - "15433:5432"
