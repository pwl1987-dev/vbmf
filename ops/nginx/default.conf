# VBMF Nginx ingress - SOLE external HTTP/HTTPS entry (Deployment SoT §8)
# Routes: /api /ws /events /ops /admin /health -> fastify ; / -> web
# Media protocol plane (RTMP/SRT/HLS/WHEP) is owned by SRS, NOT proxied here as media.

upstream fastify {
    server fastify:3000;
    keepalive 32;
}
upstream web {
    server web:5173;
}

# Increase body size for large video uploads (API-02, tus + multipart)
client_max_body_size 0;

# ---- HTTP (redirect to HTTPS in ACCEPTANCE/PROD; dev may stay plain) ----
server {
    listen 80;
    server_name _;

    # Health/Readiness (liveness + preflight)
    # Exact match first: the prefix location /health/ does NOT match the
    # contract path /healthz (no trailing slash) — before this, /healthz
    # fell through to the SPA upstream and the Health page received HTML
    # instead of the layered health JSON (found in real BMD acceptance).
    location = /healthz {
        proxy_pass http://fastify/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {
        proxy_pass http://fastify/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health/nginx {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # WebSocket (API-03)
    location /ws/ {
        proxy_pass http://fastify/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (no buffering; long timeout)
    location /events/ {
        proxy_pass http://fastify/events/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ops API (OPS-01: stricter isolation via Fastify; Nginx just routes)
    location /ops/ {
        proxy_pass http://fastify/ops/;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API (strongest isolation)
    location /admin/ {
        proxy_pass http://fastify/admin/;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public API + large uploads
    location /api/ {
        proxy_pass http://fastify/api/;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (same-origin; browser uses /api /ws /events)
    location / {
        proxy_pass http://web/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

