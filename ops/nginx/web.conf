# VBMF Web Console container nginx config (WCE-01B · Deployment SoT §4).
# 仅在 web 容器内运行：serve Vite dist/ at port 5173.
#
# 注意：本文件 ≠ ops/nginx/default.conf（那是 compose nginx，路由 /api /
# /events/ /health/ 到 fastify 与 web upstream）。本文件只承担 web 容器内
# 的静态资源服务。

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: 任意非 /assets/ 路径都返回 index.html，由 React 处理路由。
    # 但 SSE 走 fastify 容器，不在本容器——本容器只承担 React bundle + 静态资源。
    location / {
        try_files $uri /index.html;
    }

    # Long cache for static assets (Vite 在文件名带 hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全 header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
