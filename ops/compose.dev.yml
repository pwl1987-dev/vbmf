# VBMF DEV overlay (FLOW-01 / §11 DEV profile)
# Usage: docker compose -f docker-compose.yml -f compose.dev.yml up --build web-dev
# Dev: Vite HMR via separate `web-dev` service (not the prod container);
# bind mount source for instant edit, publish 5173 only. NOT for prod.

services:
  web-dev:
    image: node:24-alpine
    working_dir: /src
    volumes:
      - ../apps/web-console:/src:rw
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    profiles: ["dev"]

  # Dev convenience: publish Fastify directly too (still behind Nginx normally)
  fastify:
    ports:
      - "3000:3000"

  # Media Agent in DEV: runtime=runc (DEPLOY-04; no runsc dependency for dev).
  # Controlled restart must preserve live session (never kill live session).
  media-agent:
    runtime: runc
    # cap_add only if device ops require; runc default usually fine without SYS_ADMIN
