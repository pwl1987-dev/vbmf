# VBMF PROD overlay (§11 PRODUCTION profile)
# Usage: docker compose -f docker-compose.yml -f compose.prod.yml up --build -d
# Immutable image / no HMR / Nginx 443 only / SRS media ports published.
# REAL secrets via Docker secrets or SSH provisioning (INFRA-SEC-01). NEVER commit.

services:
  nginx:
    ports:
      - "443:443"
      - "80:80"   # redirect to 443

  srs:
    # PR-01A: srs lives behind the `gateway` profile in BASE. These host ports
    # take effect only when the capability is explicitly enabled:
    #   docker compose --profile gateway -f ops/docker-compose.yml -f ops/compose.prod.yml up -d srs
    # Only publish what external consumers require
    ports:
      - "1935:1935"   # RTMP ingest from encoders
      - "1989:1989"   # WHEP/WebRTC playback
      - "8080:8080"   # HLS/HTTP-FLV delivery
      # 1985 (SRS API) + 8000 (SRT) kept internal unless required

  # PROD: media-agent runtime = runc (MEDIA-SEC-01裁决: Option B 已定, secure-runc-first).
  # runsc 路径已因 Step 3 枚举失败正式否决, 不再回退. 见 SoT §15 / §15.1.
  media-agent:
    runtime: runc
    # ---- Option B: device allowlist (NOT privileged) ----
    devices:
      - /dev/blackmagic:/dev/blackmagic
    device_cgroup_rules:
      - 'c 10:* rmw'
    # ---- capability 最小集 ----
    cap_drop:
      - ALL
    cap_add:
      - SYS_NICE
    # ---- 安全加固 ----
    security_opt:
      - no-new-privileges:true
    read_only: true        # PROD 只读 rootfs
    tmpfs:
      - /tmp:size=512m,mode=1777   # GStreamer/FFmpeg 可写 temp
    # ---- DeckLink IPC ----
    ipc: host
    shm_size: 1g
