name: v3 harness tooling

# PR-STAB-01 frozen plan §4 step 2 — "exact-head CI for v3 tooling".
# Tooling lane only: analyzer/collector unit tests + shell syntax + shellcheck
# on the new v3 runner. It never runs the BMD qualification ladder; hardware
# acceptance stays on the manual hardware-acceptance line.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: v3-harness-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v3-harness-tooling:
    name: v3-harness-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: v3 analyzer unit tests
        run: python3 r64-probe/test_analyze_long_v3.py
      - name: v3 tooling byte-compile
        run: python3 -m py_compile r64-probe/collect-long-v3.py r64-probe/analyze-long-v3.py
      - name: shell syntax (v3 runner + legacy driver)
        run: bash -n r64-probe/run-long-v3.sh && bash -n r64-probe/r64-stability-long.sh
      - name: shellcheck (v3 runner)
        run: shellcheck r64-probe/run-long-v3.sh
